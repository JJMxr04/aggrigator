<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aggrigator — Ops Console</title>
<meta name="csrf-token" content="{{ csrf_token }}">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script>
  // Add CSRF on every HTMX request (POST / PUT / PATCH / DELETE).
  document.body && document.body.addEventListener('htmx:configRequest', function(evt) {
    evt.detail.headers['X-CSRF-Token'] =
      document.querySelector('meta[name="csrf-token"]').getAttribute('content');
  });
  document.addEventListener('DOMContentLoaded', function() {
    document.body.addEventListener('htmx:configRequest', function(evt) {
      evt.detail.headers['X-CSRF-Token'] =
        document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    });
  });
</script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 920px; margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { margin: 0 0 .25em 0; }
  .sub { color: #666; margin-bottom: 2em; }
  .nav { margin-bottom: 1.5em; }
  .nav a { color: #0a64ff; margin-right: 1.5em; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .65em .5em; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-size: .8em; text-transform: uppercase; letter-spacing: .04em; color: #666; }
  td.actions { text-align: right; }
  .pill { display: inline-block; padding: .15em .55em; border-radius: 99px; font-size: .8em; font-weight: 600; }
  .pill.success { background: #d6f4dc; color: #146e2b; }
  .pill.failed  { background: #ffe2dd; color: #a13b2a; }
  .pill.running { background: #dceaff; color: #0a4dba; }
  .pill.never   { background: #eee; color: #666; }
  button.run { background: #0a64ff; color: #fff; border: 0; padding: .5em 1.05em; border-radius: 6px; cursor: pointer; font-size: .9em; }
  button.run:hover { background: #084dcc; }
  button.run:disabled { background: #999; cursor: not-allowed; }
  .err-excerpt { font-family: monospace; font-size: .8em; color: #a13b2a; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
  details.run-detail { margin-top: .5em; }
  details.run-detail summary { cursor: pointer; color: #0a64ff; font-size: .85em; }
  pre { background: #f5f7fb; padding: .75em; border-radius: 6px; overflow: auto; max-height: 320px; font-size: .8em; }
</style>
</head>
<body>
<h1>Aggrigator — Ops Console</h1>
<p class="sub">Logged in as <strong>{{ actor_email }}</strong>. Manually run the same crons ARQ runs on schedule.</p>

<div class="nav">
  <a href="/admin">⇐ SQLAdmin</a>
  <a href="/docs">Swagger</a>
  <a href="/healthz">/healthz</a>
</div>

{% block body %}{% endblock %}
</body>
</html>
