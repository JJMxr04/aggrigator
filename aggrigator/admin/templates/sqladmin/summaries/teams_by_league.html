{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="card">
  <div class="card-header"><h3 class="card-title">Teams by league</h3></div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th>League</th>
          <th class="text-end">Confirmed</th>
          <th class="text-end">Unconfirmed</th>
          <th class="text-end">Total</th>
        </tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr>
          <td>{{ r.league }}</td>
          <td class="text-end">{{ r.confirmed }}</td>
          <td class="text-end">{{ r.unconfirmed }}</td>
          <td class="text-end"><strong>{{ r.total }}</strong></td>
        </tr>
        {% else %}
        <tr><td colspan="4">No teams.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
