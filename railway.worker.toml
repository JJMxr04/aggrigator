## Railway service config for `agg-worker` (the Procrastinate background
## worker — task execution + in-process periodic scheduler).
##
## Used INSTEAD of the default `railway.toml` — point the worker service's
## **Config Path** at `railway.worker.toml` in its Settings tab. (Railway
## reads `railway.toml` from repo root by default; per-service overrides
## live under Service → Settings → Config Path.)
##
## Why a separate file:
## - Same Dockerfile, same image — only the start command differs.
## - The web service must NOT set startCommand (the Dockerfile's CMD ["web"]
##   handles it). The worker service MUST set startCommand to the full
##   entrypoint path because Railway's startCommand REPLACES ENTRYPOINT
##   for Dockerfile-based services (it does not append to CMD).
## - Healthcheck must be disabled — the worker has no HTTP server to probe.
##   Leaving the default healthcheckPath would mark every deployment
##   unhealthy and Railway would crashloop the container forever.
## - Restart policy is ALWAYS, not ON_FAILURE — if the worker exits cleanly
##   (e.g. a deploy / kill signal), we still want it back up. Without
##   ALWAYS, a graceful shutdown would leave the schedule dead until the
##   next manual redeploy.
##
## Procrastinate uses Postgres LISTEN/NOTIFY for job delivery, so the
## worker holds one persistent Postgres connection while idle (no polling,
## no Redis). The periodic schedule lives in-process; scaling to multiple
## replicas is safe (they cooperate via row-level locks on the
## procrastinate_periodic_defers table) but unnecessary at this app's
## volume — keep it at one replica unless you have a reason.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
## Full path required: Railway replaces ENTRYPOINT for Dockerfile services
## rather than appending to CMD, so just "worker" would try to exec a
## binary called "worker" that doesn't exist and the container would
## crashloop. The entrypoint script's `case` block dispatches on $1.
startCommand = "/app/docker-entrypoint.sh worker"

## No healthcheckPath — worker has no HTTP listener. Liveness is visible
## via the /ops/crons dashboard (reads recent rows from cron_run) and the
## procrastinate_jobs table.

restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
