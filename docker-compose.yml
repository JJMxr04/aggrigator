# Local prod-like stack for the aggregator. Mirrors what Coolify will
# deploy (web + worker + postgres) so behavior parity is testable
# before pushing.
#
# Coolify itself doesn't read this file — it builds the Dockerfile per
# Application. But you can `docker compose up` here to validate the same
# image runs end-to-end before deploying.
#
# Redis was removed in the Procrastinate cutover — task queue, periodic
# schedule, and per-cron debounce lock all live in Postgres now (the
# advisory-lock primitive replaces the old SET NX EX).
#
# Redis is back (pre-provisioned only, nothing reads it yet): the planned
# `limits`-based rate limiter needs Redis-backed storage
# because the web entrypoint runs 4 uvicorn workers — in-process counters
# would give each worker its own quota.

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: aggrigator
      POSTGRES_PASSWORD: aggrigator
      POSTGRES_DB: aggrigator
    ports:
      - "5433:5432"   # 5433 host-side to coexist with Homebrew Postgres on 5434
    volumes:
      - aggrigator_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggrigator"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pre-provisioned for the upcoming rate limiter (see header comment).
  # No auth — local only; Coolify provisions its own Redis with auth.
  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      AGG_ENV: dev
      AGG_DEBUG: "false"
      AGG_TEST_MODE: "false"   # production-like; flip true to enable data-reset
      AGG_DATABASE_URL: postgresql+asyncpg://aggrigator:aggrigator@postgres:5432/aggrigator
      AGG_DATABASE_URL_SYNC: postgresql+psycopg2://aggrigator:aggrigator@postgres:5432/aggrigator
      AGG_JWT_SECRET: dev-only-change-me
      AGG_CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      AGG_WEB_WORKERS: "4"
      # Shared counters across the 4 uvicorn workers — same shape as prod.
      AGG_RATELIMIT_STORAGE_URL: redis://redis:6379
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      web:      { condition: service_healthy }
    command: ["worker"]
    environment:
      AGG_ENV: dev
      AGG_DATABASE_URL: postgresql+asyncpg://aggrigator:aggrigator@postgres:5432/aggrigator
      AGG_DATABASE_URL_SYNC: postgresql+psycopg2://aggrigator:aggrigator@postgres:5432/aggrigator

volumes:
  aggrigator_pg:
