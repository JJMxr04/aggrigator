## Railway service config for `agg-web` (the FastAPI app).
##
## This file is the project default — Railway reads `railway.toml` from
## the repo root. The `agg-worker` service uses a sibling file,
## `railway.worker.toml`, configured per-service via Settings → Config
## Path. See RAILWAY.md §5 for the one-time setup.
##
## DO NOT set `startCommand` here. For Dockerfile-based services Railway's
## startCommand REPLACES the image's ENTRYPOINT entirely (it does NOT
## append to CMD), so e.g. `startCommand = "web"` would try to exec a
## "web" binary that doesn't exist. Leaving it unset lets the Dockerfile's
## ENTRYPOINT ["/app/docker-entrypoint.sh"] + CMD ["web"] apply naturally
## — that's the right default for the web service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs once per deploy, before the new container takes traffic. If
# alembic fails, the deploy aborts and the old image keeps serving —
# no half-migrated state, no crash-loop. The web container's
# entrypoint still runs `alembic upgrade head` on boot as a safety
# net (idempotent), but this is the authoritative step.
preDeployCommand = "alembic upgrade head"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
