# CI: one workflow per push/PR so the Actions tab shows a single run.
# Jobs:
#   - pip-audit:    dependency CVE scan (also runs weekly via the cron below,
#                   to catch new CVEs landing against unchanged requirements).
#   - lint:         ruff over the repo (config in pyproject.toml [tool.ruff]).
#   - unit:         pytest tests/unit, no services. Fixture-backed cases skip
#                   because tests/fixtures/oddsapi/ is not committed.
#   - integration:  ephemeral Postgres + `alembic upgrade head`, then
#                   pytest tests/integration. The per-test TRUNCATE is safe
#                   only because the DB is throwaway — AGG_TEST_DATABASE_URL
#                   points at the service's own database.
#
# On the weekly schedule only pip-audit runs; lint/unit/integration are gated
# to push/PR events.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements
        # Audits the pinned requirements file directly — no project
        # install needed, so the job stays fast and side-effect-free.
        run: pip-audit -r requirements.txt --strict

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.12
      - name: Ruff lint
        run: ruff check .

  unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned deps + package
        # requirements.txt is the single source of truth for runtime deps
        # (pyproject.toml's are intentionally loose); requirements-dev.txt
        # pulls it in plus pytest/ruff. --no-deps installs just the editable
        # package without re-resolving the pinned set.
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Unit tests
        run: pytest tests/unit -vv

  integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aggrigator
          POSTGRES_PASSWORD: aggrigator
          POSTGRES_DB: aggrigator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aggrigator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGG_DATABASE_URL: postgresql+asyncpg://aggrigator:aggrigator@localhost:5432/aggrigator
      AGG_DATABASE_URL_SYNC: postgresql+psycopg2://aggrigator:aggrigator@localhost:5432/aggrigator
      AGG_TEST_DATABASE_URL: postgresql+asyncpg://aggrigator:aggrigator@localhost:5432/aggrigator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned deps + package
        # requirements.txt is the single source of truth for runtime deps
        # (pyproject.toml's are intentionally loose); requirements-dev.txt
        # pulls it in plus pytest/ruff. --no-deps installs just the editable
        # package without re-resolving the pinned set.
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Create schema
        run: alembic upgrade head
      - name: Integration tests
        run: pytest tests/integration -vv
