# Security scanning, kept separate from ci.yml so the gate reads on its own.
# Every job exits non-zero on any finding, so once these are marked as
# required status checks (Settings -> Branches) they block the merge.
# Jobs:
#   - semgrep:  OWASP Top 10 + Python SAST (XSS, SQLi, command injection, SSRF).
#   - bandit:   Python-specific checks (raw SQL, eval/exec, weak crypto, hardcoded creds).
#   - gitleaks: committed secret/token scan over full history.
# Dependency CVEs (pip-audit) already run in ci.yml, so they're not duplicated here.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep scan
        # --error makes the job fail on any finding. OSS rule packs only, no login.
        run: |
          semgrep scan --error --metrics off --disable-version-check \
            --config p/python --config p/secrets --config p/owasp-top-ten --config p/ci \
            --exclude tests --exclude alembic .

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install "bandit[toml]"
      - name: Bandit scan
        # Excludes come from [tool.bandit] in pyproject.toml.
        run: bandit -r . -c pyproject.toml

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Free for personal-account repos; no GITLEAKS_LICENSE needed.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
